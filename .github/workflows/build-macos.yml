name: "Build and Test - macOS"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Make Build Script Executable
        run: chmod +x scripts/build-macos-dmg.sh

      - name: Build macOS Package (Apple Silicon - arm64)
        run: |
          VER="${{ github.event.inputs.version }}"
          bash scripts/build-macos-dmg.sh "${VER:-1.0.0}" "osx-arm64"

      - name: Build macOS Package (Intel - x64)
        run: |
          VER="${{ github.event.inputs.version }}"
          bash scripts/build-macos-dmg.sh "${VER:-1.0.0}" "osx-x64"

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safescribe-macos-installer
          path: dist/*
          if-no-files-found: error
