name: "Release Cross-Platform Packages"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-release:
    name: Build Windows Release Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "1.0.0" }
          .\scripts\build-windows-installer.ps1 -Version $ver

      - name: Upload Windows Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  build-macos-release:
    name: Build macOS Release Package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build macOS DMGs
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          chmod +x scripts/build-macos-dmg.sh
          bash scripts/build-macos-dmg.sh "$VER" "osx-arm64"
          bash scripts/build-macos-dmg.sh "$VER" "osx-x64"

      - name: Upload macOS Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*

  build-linux-release:
    name: Build Linux Release Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Linux Package
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          chmod +x scripts/build-linux-package.sh
          bash scripts/build-linux-package.sh "$VER"

      - name: Upload Linux Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  create-github-release:
    name: Publish Release to GitHub
    needs: [build-windows-release, build-macos-release, build-linux-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Determine Release Tag
        id: release-tag
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          echo "TAG=v${VER}" >> $GITHUB_OUTPUT
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.TAG }}
          name: SafeScribe AI ${{ steps.release-tag.outputs.TAG }}
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
